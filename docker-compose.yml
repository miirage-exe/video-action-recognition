services:
  training:
    build: .
    # Enable NVIDIA GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Dataset (read-only)
      - ./data:/workspace/data:ro
      # Trained models and figures are written here on the host
      - ./outputs:/workspace/outputs
